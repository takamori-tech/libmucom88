<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" font-family="sans-serif">
  <title>libmucom88の構成</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526579"/></marker></defs>
  <rect width="780" height="590" rx="10" fill="#f8fafc"/>
  <text x="390" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">libmucom88の構成</text>
  <rect x="190" y="60" width="400" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="390.0" y="85" text-anchor="middle" font-size="16" fill="#16324f">MMLテキスト / 外部音色</text>
  <text x="390.0" y="107" text-anchor="middle" font-size="12" fill="#334155">利用側で読み込み・パス解決</text>
  <path d="M390 122 L390 151" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="154" width="400" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="390.0" y="179" text-anchor="middle" font-size="16" fill="#16324f">MmlParser</text>
  <text x="390.0" y="201" text-anchor="middle" font-size="12" fill="#334155">MucFile：音色・メタデータ・11トラックのイベント</text>
  <path d="M390 216 L390 245" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="248" width="400" height="82" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="390.0" y="273" text-anchor="middle" font-size="16" fill="#16324f">MmlEngine</text>
  <text x="390.0" y="295" text-anchor="middle" font-size="12" fill="#334155">演奏進行・レジスタ制御・ボイス / SE</text>
  <text x="390.0" y="315" text-anchor="middle" font-size="12" fill="#334155">renderMixed()：最大16フレームごとに更新</text>
  <path d="M390 330 L390 359" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="362" width="400" height="82" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="390.0" y="387" text-anchor="middle" font-size="16" fill="#16324f">IFmEngine → 音源バックエンド</text>
  <text x="390.0" y="409" text-anchor="middle" font-size="12" fill="#334155">利用側の実装、または付属FmEngineYmfm</text>
  <text x="390.0" y="429" text-anchor="middle" font-size="12" fill="#334155">writeReg() / generateInterleaved()</text>
  <path d="M390 444 L390 473" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="476" width="400" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="390.0" y="501" text-anchor="middle" font-size="16" fill="#16324f">ステレオPCM → 利用側の音声出力</text>
  <text x="390.0" y="523" text-anchor="middle" font-size="12" fill="#334155">int16のL/Rインターリーブ</text>
  <text x="390" y="568" text-anchor="middle" font-size="13" fill="#334155">バックエンドの所有・寿命・同期・音声デバイスは利用側が管理</text>

</svg>
