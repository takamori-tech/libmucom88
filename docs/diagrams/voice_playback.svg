<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-g" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#E65100"/>
    </marker>
    <marker id="arr-d" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#455A64"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#FAFBFC" rx="6"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#263238" letter-spacing="0.5">Voice Playback Flow (ADPCM-B)</text>
  <line x1="210" y1="38" x2="510" y2="38" stroke="#CFD8DC" stroke-width="0.5"/>

  <!-- ==================== Timeline ==================== -->
  <!-- K Track status bar -->
  <text x="40" y="75" font-size="9" font-weight="600" fill="#78909C">K Track (BGM)</text>
  <rect x="40" y="82" width="130" height="20" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="105" y="96" text-anchor="middle" font-size="8" fill="#2E7D32">Playing</text>
  <rect x="170" y="82" width="300" height="20" rx="4" fill="#FFEBEE" stroke="#EF9A9A" stroke-width="1"/>
  <text x="320" y="96" text-anchor="middle" font-size="8" fill="#C62828">Suppressed (voiceOverride=true)</text>
  <rect x="470" y="82" width="210" height="20" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="575" y="96" text-anchor="middle" font-size="8" fill="#2E7D32">Auto Resume</text>

  <!-- Voice status bar -->
  <text x="40" y="125" font-size="9" font-weight="600" fill="#78909C">Voice (ADPCM-B)</text>
  <rect x="40" y="132" width="130" height="20" rx="4" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1"/>
  <text x="105" y="146" text-anchor="middle" font-size="8" fill="#90A4AE">Idle</text>
  <rect x="170" y="132" width="300" height="20" rx="4" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="320" y="146" text-anchor="middle" font-size="8" font-weight="600" fill="#E65100">Voice Playing</text>
  <rect x="470" y="132" width="210" height="20" rx="4" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1"/>
  <text x="575" y="146" text-anchor="middle" font-size="8" fill="#90A4AE">Idle</text>

  <!-- Event markers -->
  <line x1="170" y1="65" x2="170" y2="160" stroke="#E65100" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="470" y1="65" x2="470" y2="160" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Event labels -->
  <g filter="url(#shadow)">
    <rect x="130" y="48" width="80" height="18" rx="4" fill="#E65100"/>
  </g>
  <text x="170" y="61" text-anchor="middle" font-size="7.5" font-weight="600" fill="#FFF">playVoice()</text>

  <g filter="url(#shadow)">
    <rect x="415" y="48" width="110" height="18" rx="4" fill="#2E7D32"/>
  </g>
  <text x="470" y="61" text-anchor="middle" font-size="7.5" font-weight="600" fill="#FFF">tickVoiceTimer()</text>

  <!-- ==================== Flow Steps ==================== -->
  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="180" width="190" height="60" rx="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.2"/>
  </g>
  <text x="50" y="198" font-size="10" font-weight="600" fill="#E65100">1. playVoice(id)</text>
  <text x="50" y="214" font-size="8.5" fill="#37474F">K track KEY_OFF</text>
  <text x="50" y="228" font-size="8.5" fill="#37474F">voiceOverride = true</text>

  <!-- Arrow -->
  <line x1="230" y1="210" x2="268" y2="210" stroke="#455A64" stroke-width="1.5" marker-end="url(#arr-d)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="272" y="180" width="190" height="60" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.2"/>
  </g>
  <text x="282" y="198" font-size="10" font-weight="600" fill="#0D47A1">2. During playback</text>
  <text x="282" y="214" font-size="8.5" fill="#37474F">K events skipped</text>
  <text x="282" y="228" font-size="8.5" fill="#37474F">Other ch normal</text>

  <!-- Arrow -->
  <line x1="462" y1="210" x2="498" y2="210" stroke="#455A64" stroke-width="1.5" marker-end="url(#arr-d)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="502" y="180" width="190" height="60" rx="8" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1.2"/>
  </g>
  <text x="512" y="198" font-size="10" font-weight="600" fill="#1B5E20">3. Voice ends</text>
  <text x="512" y="214" font-size="8.5" fill="#37474F">voiceOverride = false</text>
  <text x="512" y="228" font-size="8.5" fill="#37474F">K track auto-resume</text>

  <!-- ==================== Ducking (optional) ==================== -->
  <text x="40" y="270" font-size="9" font-weight="600" fill="#78909C">Ducking (optional)</text>
  <rect x="40" y="278" width="130" height="16" rx="4" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="0.8"/>
  <text x="105" y="290" text-anchor="middle" font-size="7.5" fill="#2E7D32">Normal</text>
  <rect x="170" y="278" width="300" height="16" rx="4" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.8"/>
  <text x="320" y="290" text-anchor="middle" font-size="7.5" fill="#C62828">FM/SSG Attenuated (-15dB)</text>
  <rect x="470" y="278" width="80" height="16" rx="4" fill="#FFF9C4" stroke="#FFF176" stroke-width="0.8"/>
  <text x="510" y="290" text-anchor="middle" font-size="7.5" fill="#F57F17">Release</text>
  <rect x="550" y="278" width="130" height="16" rx="4" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="0.8"/>
  <text x="615" y="290" text-anchor="middle" font-size="7.5" fill="#2E7D32">Normal</text>

  <!-- Note -->
  <rect x="40" y="306" width="640" height="24" rx="4" fill="#FAFBFC" stroke="#ECEFF1" stroke-width="0.5"/>
  <text x="360" y="322" text-anchor="middle" font-size="8.5" fill="#78909C">tickVoiceTimer() must be called every frame unconditionally (ducking release depends on it)</text>

  <text x="700" y="335" text-anchor="end" font-size="7" fill="#B0BEC5">2026</text>
</svg>
