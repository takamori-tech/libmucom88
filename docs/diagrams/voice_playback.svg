<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 398" font-family="sans-serif">
  <title>ADPCM-BボイスとKトラックの優先制御</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526579"/></marker></defs>
  <rect width="780" height="398" rx="10" fill="#f8fafc"/>
  <text x="390" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">ADPCM-BボイスとKトラックの優先制御</text>
  <text x="32" y="88" text-anchor="start" font-size="13" fill="#334155">状態</text>
  <rect x="140" y="60" width="90" height="45" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="185.0" y="85" text-anchor="middle" font-size="16" fill="#16324f">Idle</text>
  <rect x="230" y="60" width="260" height="45" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
  <text x="360.0" y="85" text-anchor="middle" font-size="16" fill="#16324f">Playing</text>
  <rect x="490" y="60" width="120" height="45" rx="8" fill="#fef9c3" stroke="#94a3b8"/>
  <text x="550.0" y="85" text-anchor="middle" font-size="16" fill="#16324f">Releasing</text>
  <rect x="610" y="60" width="135" height="45" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="677.5" y="85" text-anchor="middle" font-size="16" fill="#16324f">Idle</text>
  <text x="32" y="145" text-anchor="start" font-size="13" fill="#334155">Kトラック</text>
  <rect x="140" y="117" width="90" height="45" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="185.0" y="142" text-anchor="middle" font-size="16" fill="#16324f">通常</text>
  <rect x="230" y="117" width="380" height="45" rx="8" fill="#fee2e2" stroke="#94a3b8"/>
  <text x="420.0" y="142" text-anchor="middle" font-size="16" fill="#16324f">イベント処理を抑制</text>
  <rect x="610" y="117" width="135" height="45" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="677.5" y="142" text-anchor="middle" font-size="16" fill="#16324f">処理再開</text>
  <text x="32" y="202" text-anchor="start" font-size="13" fill="#334155">ボイス</text>
  <rect x="140" y="174" width="90" height="45" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="185.0" y="199" text-anchor="middle" font-size="16" fill="#16324f">停止</text>
  <rect x="230" y="174" width="260" height="45" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
  <text x="360.0" y="199" text-anchor="middle" font-size="16" fill="#16324f">ADPCM-Bで再生</text>
  <rect x="490" y="174" width="255" height="45" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="617.5" y="199" text-anchor="middle" font-size="16" fill="#16324f">再生終了</text>
  <text x="230" y="250" text-anchor="middle" font-size="12" fill="#334155">playVoice(id)</text>
  <text x="490" y="250" text-anchor="middle" font-size="12" fill="#334155">終了検出</text>
  <text x="640" y="250" text-anchor="middle" font-size="12" fill="#334155">復帰完了</text>
  <text x="390" y="291" text-anchor="middle" font-size="15" fill="#334155">renderMixed() がボイスタイマーとダッキング復帰を更新</text>
  <text x="390" y="319" text-anchor="middle" font-size="13" fill="#334155">復帰時間などの条件によっては、Playingから直接Idleへ戻ります。</text>
  <text x="390" y="346" text-anchor="middle" font-size="13" fill="#334155">isVoicePlaying() がfalseになっても、Kの抑制が続く場合があります。</text>
  <text x="390" y="373" text-anchor="middle" font-size="13" fill="#334155">stopVoice() / stopAdpcmB() は優先状態と減衰を解除します。</text>

</svg>
