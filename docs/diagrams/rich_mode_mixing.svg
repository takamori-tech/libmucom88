<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="sans-serif">
  <title>renderMixed()：RichモードのPCM合算</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#526579"/></marker></defs>
  <rect width="780" height="410" rx="10" fill="#f8fafc"/>
  <text x="390" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#16324f">renderMixed()：RichモードのPCM合算</text>
  <rect x="35" y="80" width="190" height="85" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="130.0" y="105" text-anchor="middle" font-size="16" fill="#16324f">BGMチップ</text>
  <text x="130.0" y="127" text-anchor="middle" font-size="12" fill="#334155">BGM + ADPCM-Bボイス</text>
  <text x="130.0" y="147" text-anchor="middle" font-size="12" fill="#334155">int16 PCM</text>
  <path d="M225 122 L270 122" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="275" y="80" width="190" height="85" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="370.0" y="105" text-anchor="middle" font-size="16" fill="#16324f">× outputGain</text>
  <text x="370.0" y="127" text-anchor="middle" font-size="12" fill="#334155">Tuned：fmgen 1.0</text>
  <text x="370.0" y="147" text-anchor="middle" font-size="12" fill="#334155">ymfm 約1.3335</text>
  <rect x="35" y="220" width="190" height="65" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
  <text x="130.0" y="245" text-anchor="middle" font-size="16" fill="#16324f">SE専用チップ</text>
  <text x="130.0" y="267" text-anchor="middle" font-size="12" fill="#334155">int16 PCM</text>
  <path d="M225 252 L270 252" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="275" y="220" width="190" height="65" rx="8" fill="#ffedd5" stroke="#94a3b8"/>
  <text x="370.0" y="245" text-anchor="middle" font-size="16" fill="#16324f">× 1.0</text>
  <text x="370.0" y="267" text-anchor="middle" font-size="12" fill="#334155">SE音量はレジスタで調整</text>
  <path d="M465 122 L518 174" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M465 252 L518 195" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="525" y="150" width="220" height="75" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
  <text x="635.0" y="175" text-anchor="middle" font-size="16" fill="#16324f">加算 → softLimit16()</text>
  <text x="635.0" y="197" text-anchor="middle" font-size="12" fill="#334155">int16ステレオ出力</text>
  <text x="390" y="330" text-anchor="middle" font-size="15" fill="#334155">Rich：BGM × outputGain + SE → ソフトリミッター</text>
  <text x="390" y="356" text-anchor="middle" font-size="13" fill="#334155">Classic：gain = 1 はコピー、gain ≠ 1 は倍率適用＋ソフトリミッター</text>
  <text x="390" y="382" text-anchor="middle" font-size="13" fill="#334155">各チップ内部の出力処理は、この合算より前に行われます。</text>

</svg>
